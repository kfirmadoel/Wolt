services:
  backend:
    profiles: ["backend", "app"]
    build:
      context: ./src/web/backend
      dockerfile: Dockerfile.web
      args:
        BACKEND_PORT: ${BACKEND_PORT:-3000}
    environment:
      BACKEND_PORT: ${BACKEND_PORT:-3000}
    ports:
      - "${BACKEND_PORT:-3000}:${BACKEND_PORT:-3000}"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:' + process.env.BACKEND_PORT + '/api/health', (r) => { r.resume(); process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1))"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    profiles: ["frontend", "app"]
    build:
      context: ./src/web/frontend
      dockerfile: Dockerfile.frontend
      args:
        REACT_APP_API_BASE_URL: http://localhost:${BACKEND_PORT:-3000}
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend-tests:
    build:
      context: ./src/web/backend
      dockerfile: Dockerfile.web
      args:
        BACKEND_PORT: ${BACKEND_PORT:-3000}
    command: ["npm", "test"]
    profiles: ["test"]
