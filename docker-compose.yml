# Define an internal network for inter-service communication
networks:
  wolt-network:
    driver: bridge

services:
  # C++ Server - Acts as a TCP server for user product tracking
  server:
    build:
      context: ./src/server
      dockerfile: Dockerfile.server
    container_name: cpp-server
    expose:
      - "12345"
    volumes:
      - ./data:/usr/src/wolt_project/data
    networks:
      - wolt-network
    command: ./build/server 12345
    # Health check to ensure server is ready
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1', 12345)); s.close()
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Node.js Web Server - Communicates with C++ server via TCP
  web-server:
    build:
      context: ./src/web
      dockerfile: Dockerfile.web
    container_name: web-server
    ports:
      - "3000:3000"
    networks:
      - wolt-network
    depends_on:
      server:
        condition: service_healthy
    environment:
      - CPP_SERVER_HOST=server
      - CPP_SERVER_PORT=12345
    # Health check
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:3000/api/health
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Python Client - For testing and interaction
  client:
    build:
      context: ./src/client
      dockerfile: Dockerfile.client
    container_name: client
    networks:
      - wolt-network
    depends_on:
      server:
        condition: service_healthy
    stdin_open: true
    tty: true
    environment:
      - CPP_SERVER_HOST=server
      - CPP_SERVER_PORT=12345

  tests:
    build:
      context: ./src/server
      dockerfile: Dockerfile.server
    container_name: wolt-tests
    networks:
      - wolt-network
    command: ctest --test-dir /usr/src/wolt_project/build --output-on-failure
    depends_on:
      server:
        condition: service_healthy

  web-tests:
    build:
      context: ./src/web
      dockerfile: Dockerfile.web
    container_name: web-tests
    profiles:
      - tests
    networks:
      - wolt-network
    depends_on:
      server:
        condition: service_healthy
    command: npm test
    environment:
      - CPP_SERVER_HOST=server
      - CPP_SERVER_PORT=12345
